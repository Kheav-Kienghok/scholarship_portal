name: CI

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install make
      run: sudo apt-get update && sudo apt-get install -y make

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      run: docker build --no-cache -t kienghok/scholarship_portals:debug --target debug . 

    - name: Push Docker image
      run: docker push kienghok/scholarship_portals:debug

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
    - name: Pull Docker image
      run: docker pull kienghok/scholarship_portals:debug

    - name: Delete Old Container
      run: docker rm -f scholarship_portal || true

    - name: Run Docker container
      run: |
        docker run -d \
          --name scholarship_portal \
          -p 8080:8080 \
          -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
          -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
          -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
          -e FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
          -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
          kienghok/scholarship_portals:debug